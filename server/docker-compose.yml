version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cipherdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cipherdrop
      POSTGRES_PASSWORD: cipherdrop
      POSTGRES_DB: cipherdrop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherdrop -d cipherdrop"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cipherdrop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cipherdrop-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://cipherdrop:cipherdrop@postgres:5432/cipherdrop?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: ./uploads
      BASE_URL: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --skip-generate && node dist/index.js"

  frontend:
    build:
      context: ..
      dockerfile: server/Dockerfile.frontend
    container_name: cipherdrop-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cipherdrop-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres-data:
  redis-data:
